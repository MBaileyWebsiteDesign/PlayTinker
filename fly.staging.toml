# Fly.io configuration for the PlayTinker STAGING site (deployed from the staging branch).
# Change "app" to a unique name the first time you run `fly launch --no-deploy`.
app = "playtinker-concept-staging"
primary_region = "lhr"   # London

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # sleeps when idle to keep costs low
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
