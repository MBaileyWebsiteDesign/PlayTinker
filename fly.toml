# Fly.io configuration for the PlayTinker LIVE site (deployed from the main branch).
# Staging uses fly.staging.toml (app playtinker-concept-staging).
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'playtinker-concept'
primary_region = 'lhr'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
